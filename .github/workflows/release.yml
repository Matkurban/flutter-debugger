name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - extension.toml
      - server/Cargo.toml

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^version\s*=' extension.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff HEAD~1 HEAD -- extension.toml server/Cargo.toml | grep -Eq '^\+version\s*='; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_release=false" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: flutter-debugger-server-linux-x86_64.tar.gz
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: flutter-debugger-server-linux-aarch64.tar.gz
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: flutter-debugger-server-macos-aarch64.tar.gz
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: flutter-debugger-server-macos-x86_64.tar.gz
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: flutter-debugger-server-windows-x86_64.zip
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "server/target/${{ matrix.target }}/release" flutter-debugger-server

      - name: Package zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "server/target/${{ matrix.target }}/release/flutter-debugger-server.exe" -DestinationPath "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes
          fi
