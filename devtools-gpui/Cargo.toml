[package]
name = "flutter-devtools-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native GPUI Flutter DevTools companion application for Zed"

[[bin]]
name = "flutter-devtools-gpui"
path = "src/main.rs"

[dependencies]
async-channel = "2.5"
base64 = "0.22"
dirs = "6.0"
flutter-debugger-protocol = { path = "../crates/protocol" }
futures-util = "0.3"
gpui-kit = "0.11"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "fs"] }
tokio-tungstenite = "0.30"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
