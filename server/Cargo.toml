[package]
name = "flutter-debugger-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native LSP and DAP proxy server for the Flutter Debugger Zed extension"

[[bin]]
name = "flutter-debugger-server"
path = "src/main.rs"

[dependencies]
dashmap = "6.2"
dirs = "6.0"
flutter-debugger-protocol = { path = "../crates/protocol" }
futures-util = "0.3"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "gzip", "system-proxy"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "process", "signal", "sync", "time", "fs"] }
tower-lsp-server = "0.23.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
